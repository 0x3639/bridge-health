services:
  collector:
    build:
      context: ..
      target: collector
    restart: unless-stopped
    user: "${COLLECTOR_UID:?set collector UID}:${COLLECTOR_GID:?set collector GID}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports: ["${COLLECTOR_BIND_IP:-127.0.0.1}:8443:8443"]
    volumes:
      - "${COLLECTOR_CONFIG:?set collector configuration directory}:/etc/bridge-health:ro"
      - "${COLLECTOR_STATE:?set collector state directory}:/state"
    command:
      - serve
      - -listen
      - "0.0.0.0:8443"
      - -state
      - /state
      - -enrollments
      - /etc/bridge-health/enrollments.json
      - -cert
      - /etc/bridge-health/server.crt
      - -key
      - /etc/bridge-health/server.key
      - -client-ca
      - /etc/bridge-health/client-ca.crt
