{{define "layout"}}<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{.Title}} · Bridge Health</title>
  <link rel="stylesheet" href="/assets/ui/app.css">
  <script type="module" src="/assets/ui/app.js"></script>
</head>
<body>
  <header><div class="bar"><a class="brand" href="/"><span class="brand-icon" aria-hidden="true"></span>Bridge Health</a><span class="network">Zenon Mainnet</span></div></header>
  <main id="app" data-view="{{.View}}">
    {{if eq .View "public"}}<h1>Pillar status</h1><p>Loading pillar status…</p>{{end}}
    <noscript>{{if eq .View "install"}}Download <a href="/install.py" download>bridge-health-install.py</a> on the orchestrator host, run <code>sudo python3 -I bridge-health-install.py</code> and paste your private installation URL.{{else if eq .View "public"}}Read the <a href="/api/status">current status as JSON</a> or enable JavaScript to view the dashboard.{{else}}Enable JavaScript to use receiver administration.{{end}}</noscript>
  </main>
  {{if ne .View "public"}}<script type="application/json" id="page">{{.}}</script>{{end}}
</body>
</html>{{end}}
